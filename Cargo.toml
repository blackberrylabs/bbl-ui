[package]
name = "bbl-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Alexandre Do"]
repository = "https://github.com/blackberrylabs/bbl-ui"
description = "The shared face of the Blackberrylabs desktop tools: palette, iced building blocks, interface preferences, translated strings"
keywords = ["iced", "ui", "desktop"]
categories = ["gui"]

[dependencies]
iced = "=0.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
